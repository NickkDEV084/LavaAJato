<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos e estoque | LavaAjato</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="inventory">
  <div class="layout">
    <aside class="menu">
      <h1 class="logo">LavaAjato</h1>
      <nav>
        <a href="gestao.html">Painel</a>
        <a href="servicos.html">Serviços e preços</a>
        <a href="agenda.html">Agenda e fila</a>
        <a href="pedidos.html">Pedidos e pagamentos</a>
        <a href="produtos.html" class="ativo">Produtos e estoque</a>
        <a href="status.html">Status do serviço</a>
        <a href="cancelamentos.html">Cancelamentos</a>
        <a href="relatorios.html">Relatórios</a>
      </nav>
    </aside>
    <main class="conteudo">
      <header class="topo"><h2>Produtos e estoque</h2></header>
      <section class="card">
        <h3>Novo produto</h3>
        <form action="#" method="post" class="form-grid">
          <label>Nome<input type="text" name="nome"></label>
          <label>Quantidade em estoque<input type="number" name="qtd"></label>
          <label>Estoque mínimo<input type="number" name="minimo"></label>
          <label>Preço (R$)<input type="number" name="preco"></label>
          <div class="acoes"><button type="submit" class="btn">Salvar</button><button type="reset" class="btn btn-sec">Limpar</button></div>
        </form>
      </section>
      <section class="card">
        <h3>Lista</h3>
        <div class="tabela-wrap">
          <table>
            <thead><tr><th>Produto</th><th>Estoque</th><th>Mínimo</th><th>Situação</th></tr></thead>
            <tbody>
            <tr><td>Shampoo automotivo</td><td>10</td><td>3</td><td><span class="badge ok">Normal</span></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
