name: CI

on:
  pull_request:
    branches: [develop, "Principal!"]
  push:
    branches: [develop, "Principal!"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  testes:
    name: Lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar uv e Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Mínimo do requires-python (>=3.12) e do target-version do ruff (py312).
          python-version: "3.12"

      - name: Instalar dependências (falha se o uv.lock estiver desatualizado)
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (formatação)
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest
