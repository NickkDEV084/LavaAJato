[project]
name = "lavaajato"
version = "0.1.0"
description = "API do sistema de gestão de lava-jato (LavaAjato)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
# Projeto de aplicação (não é uma biblioteca para publicar).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# backend/ é o código antigo, mantido só como referência.
extend-exclude = ["backend", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
